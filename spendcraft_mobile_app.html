<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpendCraft Pro - Marriage & Construction Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for standalone JSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
    }
    @keyframes deduct-float {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      20% { opacity: 1; transform: translateY(0) scale(1.02); }
      80% { opacity: 1; transform: translateY(-4px) scale(1); }
      100% { opacity: 0; transform: translateY(-16px) scale(0.95); }
    }
    .animate-deduct {
      animation: deduct-float 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white pb-24">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Currency Formatter
    function formatCurrency(amount, compact = false) {
      const num = Number(amount) || 0;
      if (compact) {
        if (Math.abs(num) >= 10000000) return `₹${(num / 10000000).toFixed(2)} Cr`;
        if (Math.abs(num) >= 100000) return `₹${(num / 100000).toFixed(2)} L`;
        if (Math.abs(num) >= 1000) return `₹${(num / 1000).toFixed(1)} K`;
      }
      return `₹${num.toLocaleString('en-IN')}`;
    }

    function formatDate(dateStr) {
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
      } catch {
        return dateStr;
      }
    }

    // Audio Feedback
    function playDeductSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    const MARRIAGE_CATEGORIES = [
      { id: 'm_venue', name: 'Venue & Mandap', icon: '🏛️', color: '#f43f5e' },
      { id: 'm_catering', name: 'Catering & Food', icon: '🍲', color: '#f97316' },
      { id: 'm_jewelry', name: 'Gold & Jewelry', icon: '💎', color: '#eab308' },
      { id: 'm_attire', name: 'Bridal & Groom Clothes', icon: '👗', color: '#ec4899' },
      { id: 'm_photo', name: 'Photo & Video', icon: '📸', color: '#8b5cf6' },
      { id: 'm_decor', name: 'Decoration & Flowers', icon: '🌸', color: '#a855f7' },
      { id: 'm_invites', name: 'Invitations & Gifts', icon: '💌', color: '#06b6d4' },
      { id: 'm_music', name: 'DJ & Music', icon: '🎶', color: '#3b82f6' },
      { id: 'm_stay', name: 'Travel & Rooms', icon: '🚗', color: '#10b981' },
      { id: 'm_beauty', name: 'Makeup & Mehendi', icon: '💄', color: '#fb7185' },
      { id: 'm_misc', name: 'Other Contingency', icon: '⚡', color: '#64748b' }
    ];

    const ENGINEER_STAGES = [
      { id: 'eng_adv', name: '1. Agreement & Booking Advance', icon: '📝', color: '#6366f1' },
      { id: 'eng_footing', name: '2. Foundation & Footing Stage', icon: '🏗️', color: '#3b82f6' },
      { id: 'eng_plinth', name: '3. Plinth Beam & Basement Level', icon: '🧱', color: '#06b6d4' },
      { id: 'eng_gf_slab', name: '4. Ground Floor Roof Slab', icon: '🏢', color: '#10b981' },
      { id: 'eng_ff_slab', name: '5. First Floor Roof Slab', icon: '🏗️', color: '#84cc16' },
      { id: 'eng_brick', name: '6. Brickwork & Masonry Walls', icon: '🏠', color: '#eab308' },
      { id: 'eng_plaster', name: '7. Inner & Outer Plastering', icon: '🧱', color: '#f59e0b' },
      { id: 'eng_tiles', name: '8. Flooring & Wall Tiles', icon: '🔲', color: '#f97316' },
      { id: 'eng_elec', name: '9. Electrical & Plumbing Lines', icon: '⚡', color: '#ec4899' },
      { id: 'eng_paint', name: '10. Painting & Doors/Windows', icon: '🎨', color: '#a855f7' },
      { id: 'eng_handover', name: '11. Final Handover & Keys', icon: '🔑', color: '#14b8a6' },
      { id: 'eng_extra', name: '12. Extra Works / Changes', icon: '✨', color: '#64748b' }
    ];

    const INITIAL_BUDGET = 2500000; // ₹ 25 Lakhs default for both

    const INITIAL_EXPENSES = [
      { id: '1', type: 'marriage', title: 'Convention Hall Booking', amount: 350000, categoryId: 'm_venue', categoryName: 'Venue & Mandap', date: '2026-08-10', vendor: 'Grand Palace' },
      { id: '2', type: 'marriage', title: 'Bridal Gold Necklace Set', amount: 520000, categoryId: 'm_jewelry', categoryName: 'Gold & Jewelry', date: '2026-08-18', vendor: 'Tanishq Jewellers' },
      { id: '3', type: 'marriage', title: 'Catering Advance (800 guests)', amount: 200000, categoryId: 'm_catering', categoryName: 'Catering & Food', date: '2026-08-25', vendor: 'Sri Balaji Caterers' },
      { id: '4', type: 'marriage', title: 'Pre-wedding Shoot & Drone', amount: 120000, categoryId: 'm_photo', categoryName: 'Photo & Video', date: '2026-09-02', vendor: 'PixelCraft' },
      
      { id: '5', type: 'construction', title: 'Contract Signing Advance', amount: 250000, categoryId: 'eng_adv', categoryName: '1. Agreement & Booking Advance', date: '2026-06-15', vendor: 'Er. Rajesh Kumar', receiptNo: 'REC-001' },
      { id: '6', type: 'construction', title: 'Foundation & Footing Stage', amount: 300000, categoryId: 'eng_footing', categoryName: '2. Foundation & Footing Stage', date: '2026-07-05', vendor: 'Er. Rajesh Kumar', receiptNo: 'CHQ-881290' },
      { id: '7', type: 'construction', title: 'Plinth Beam & Basement Slab', amount: 350000, categoryId: 'eng_plinth', categoryName: '3. Plinth Beam & Basement Level', date: '2026-07-28', vendor: 'Er. Rajesh Kumar', receiptNo: 'REC-003' },
      { id: '8', type: 'construction', title: 'GF Roof Slab Concrete Casting', amount: 400000, categoryId: 'eng_gf_slab', categoryName: '4. Ground Floor Roof Slab', date: '2026-08-20', vendor: 'Er. Rajesh Kumar', receiptNo: 'REC-004' }
    ];

    function App() {
      const [totalBudget, setTotalBudget] = useState(() => {
        const saved = localStorage.getItem('spendcraft_standalone_budget');
        return saved ? Number(saved) : INITIAL_BUDGET;
      });

      const [sqftArea, setSqftArea] = useState(1250);
      const [ratePerSqft, setRatePerSqft] = useState(2000);
      const [engineerName, setEngineerName] = useState('Er. Rajesh Kumar');

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('spendcraft_standalone_expenses');
        return saved ? JSON.parse(saved) : INITIAL_EXPENSES;
      });

      const [activeTab, setActiveTab] = useState('combined'); // 'combined' | 'marriage' | 'construction'
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [isBudgetOpen, setIsBudgetOpen] = useState(false);
      const [recentDeduction, setRecentDeduction] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      useEffect(() => {
        localStorage.setItem('spendcraft_standalone_budget', totalBudget.toString());
      }, [totalBudget]);

      useEffect(() => {
        localStorage.setItem('spendcraft_standalone_expenses', JSON.stringify(expenses));
      }, [expenses]);

      // Calculations
      const marriageExpenses = expenses.filter(e => e.type === 'marriage');
      const constructionExpenses = expenses.filter(e => e.type === 'construction');

      const marriageSpent = marriageExpenses.reduce((s, e) => s + e.amount, 0);
      const constructionSpent = constructionExpenses.reduce((s, e) => s + e.amount, 0);
      const totalCombinedSpent = marriageSpent + constructionSpent;

      let currentSpent = totalCombinedSpent;
      let cardTitle = 'Combined Overall Expenses';
      let subtitle = 'Marriage + Engineer Total Capital';

      if (activeTab === 'marriage') {
        currentSpent = marriageSpent;
        cardTitle = 'Marriage Expenses';
        subtitle = 'Wedding & Function Budget';
      } else if (activeTab === 'construction') {
        currentSpent = constructionSpent;
        cardTitle = 'Engineer Contract';
        subtitle = `Sq.Ft Contract (${sqftArea} sq.ft @ ₹${ratePerSqft}/sq.ft)`;
      }

      const balanceLeft = totalBudget - currentSpent;
      const percentUsed = totalBudget > 0 ? (currentSpent / totalBudget) * 100 : 0;
      const isOver = balanceLeft < 0;

      // Add Expense handler
      const handleAddExpense = (newExp) => {
        const item = { ...newExp, id: 'exp_' + Date.now() };
        setExpenses([item, ...expenses]);
        setIsAddOpen(false);

        playDeductSound();
        setRecentDeduction({
          amount: item.amount,
          categoryName: item.categoryName
        });
        setTimeout(() => setRecentDeduction(null), 3000);
      };

      const handleDelete = (id) => {
        if (confirm('Delete this spend record? The amount will be credited back.')) {
          setExpenses(expenses.filter(e => e.id !== id));
        }
      };

      // Filtered list
      const visibleExpenses = useMemo(() => {
        let list = expenses;
        if (activeTab === 'marriage') list = marriageExpenses;
        if (activeTab === 'construction') list = constructionExpenses;

        if (!searchTerm.trim()) return list;
        const q = searchTerm.toLowerCase();
        return list.filter(e => 
          e.title.toLowerCase().includes(q) || 
          e.categoryName.toLowerCase().includes(q) ||
          (e.vendor && e.vendor.toLowerCase().includes(q))
        );
      }, [expenses, activeTab, searchTerm]);

      // Render Chart using Chart.js on mount / update
      const chartRef = useRef(null);
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) {
          chartRef.current.destroy();
        }

        let labels = [];
        let data = [];
        let bgColors = [];

        if (activeTab === 'combined') {
          labels = ['💍 Marriage Spends', '🏗️ Engineer Payouts'];
          data = [marriageSpent, constructionSpent];
          bgColors = ['#f43f5e', '#f59e0b'];
        } else if (activeTab === 'marriage') {
          const map = {};
          marriageExpenses.forEach(e => {
            map[e.categoryName] = (map[e.categoryName] || 0) + e.amount;
          });
          labels = Object.keys(map);
          data = Object.values(map);
          bgColors = ['#f43f5e', '#f97316', '#eab308', '#ec4899', '#8b5cf6', '#a855f7', '#06b6d4', '#3b82f6'];
        } else {
          const map = {};
          constructionExpenses.forEach(e => {
            map[e.categoryName] = (map[e.categoryName] || 0) + e.amount;
          });
          labels = Object.keys(map);
          data = Object.values(map);
          bgColors = ['#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#84cc16', '#eab308', '#f59e0b', '#f97316'];
        }

        if (data.length === 0 || data.every(d => d === 0)) {
          labels = ['No Spends'];
          data = [1];
          bgColors = ['#334155'];
        }

        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels,
            datasets: [{
              data,
              backgroundColor: bgColors,
              borderColor: '#0f172a',
              borderWidth: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            cutout: '72%'
          }
        });

        return () => {
          if (chartRef.current) chartRef.current.destroy();
        };
      }, [activeTab, marriageSpent, constructionSpent, expenses]);

      return (
        <div className="max-w-md mx-auto px-4 py-4 space-y-4">
          
          {/* Header */}
          <div className="flex items-center justify-between py-2 border-b border-slate-800">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center font-black text-white text-sm shadow-md">
                ₹
              </div>
              <div>
                <h1 className="text-base font-black text-white tracking-tight">SpendCraft Pro</h1>
                <p className="text-[10px] text-slate-400">Marriage & Construction Tracker</p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={() => setIsBudgetOpen(true)}
                className="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700"
              >
                Budget: <span className="font-mono text-indigo-300">{formatCurrency(totalBudget, true)}</span>
              </button>
            </div>
          </div>

          {/* 3 Mobile Tabs */}
          <div className="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-2xl border border-slate-800 shadow-md">
            <button
              onClick={() => setActiveTab('combined')}
              className={`py-2 px-1 rounded-xl text-center transition-all ${
                activeTab === 'combined' ? 'bg-indigo-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-white'
              }`}
            >
              <div className="text-xs">📊 Total</div>
              <div className="text-[10px] font-mono mt-0.5">{formatCurrency(totalCombinedSpent, true)}</div>
            </button>

            <button
              onClick={() => setActiveTab('marriage')}
              className={`py-2 px-1 rounded-xl text-center transition-all ${
                activeTab === 'marriage' ? 'bg-rose-600 text-white font-bold shadow-md' : 'text-slate-400 hover:text-white'
              }`}
            >
              <div className="text-xs">💍 Marriage</div>
              <div className="text-[10px] font-mono mt-0.5">{formatCurrency(marriageSpent, true)}</div>
            </button>

            <button
              onClick={() => setActiveTab('construction')}
              className={`py-2 px-1 rounded-xl text-center transition-all ${
                activeTab === 'construction' ? 'bg-amber-500 text-slate-950 font-black shadow-md' : 'text-slate-400 hover:text-white'
              }`}
            >
              <div className="text-xs">🏗️ Engineer</div>
              <div className="text-[10px] font-mono mt-0.5">{formatCurrency(constructionSpent, true)}</div>
            </button>
          </div>

          {/* Real-time Deduction Floating Alert */}
          {recentDeduction && (
            <div className="animate-deduct p-3 rounded-2xl bg-rose-500 text-white font-bold text-xs flex items-center justify-between shadow-xl">
              <span>- {formatCurrency(recentDeduction.amount)} Deducted!</span>
              <span className="text-[10px] bg-black/20 px-2 py-0.5 rounded-full">{recentDeduction.categoryName}</span>
            </div>
          )}

          {/* Main Visual Balance Trio Card */}
          <div className="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-xl space-y-4 relative overflow-hidden">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-base font-black text-white">{cardTitle}</h2>
                <p className="text-[11px] text-slate-400">{subtitle}</p>
              </div>
              <button
                onClick={() => setIsBudgetOpen(true)}
                className="text-[11px] font-bold text-indigo-400 bg-indigo-950/60 px-2.5 py-1 rounded-lg border border-indigo-800/40"
              >
                Edit Budget
              </button>
            </div>

            {/* 3 Metric Boxes */}
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/60">
                <span className="text-[9px] uppercase font-bold text-slate-400">Total Budget</span>
                <div className="text-sm font-black text-slate-100 font-mono mt-0.5">{formatCurrency(totalBudget, true)}</div>
                <span className="text-[8px] text-slate-500">Capital</span>
              </div>

              <div className="bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/60">
                <span className="text-[9px] uppercase font-bold text-rose-400">Total Spent</span>
                <div className="text-sm font-black text-rose-400 font-mono mt-0.5">{formatCurrency(currentSpent, true)}</div>
                <span className="text-[8px] text-rose-300 font-mono font-bold">{percentUsed.toFixed(0)}% used</span>
              </div>

              <div className={`p-2.5 rounded-2xl border ${
                isOver ? 'bg-red-950/60 border-red-500/50 text-red-300' : 'bg-emerald-950/60 border-emerald-500/50 text-emerald-300'
              }`}>
                <span className="text-[9px] uppercase font-bold">Balance Left</span>
                <div className="text-sm font-black font-mono mt-0.5">{formatCurrency(balanceLeft, true)}</div>
                <span className="text-[8px] opacity-90">{isOver ? 'Deficit' : 'in Hand'}</span>
              </div>
            </div>

            {/* Visual Progress Bar */}
            <div className="space-y-1">
              <div className="flex items-center justify-between text-[10px] text-slate-400 font-mono">
                <span>Visual Deduction Meter</span>
                <span>{percentUsed.toFixed(1)}%</span>
              </div>

              <div className="h-3 w-full bg-slate-950 rounded-full overflow-hidden p-0.5 border border-slate-800">
                {activeTab === 'combined' ? (
                  <div className="flex h-full rounded-full overflow-hidden">
                    <div style={{ width: `${(marriageSpent / totalBudget) * 100}%` }} className="bg-rose-500 h-full transition-all duration-500" />
                    <div style={{ width: `${(constructionSpent / totalBudget) * 100}%` }} className="bg-amber-500 h-full transition-all duration-500" />
                  </div>
                ) : (
                  <div 
                    style={{ width: `${Math.min(percentUsed, 100)}%` }} 
                    className={`h-full rounded-full transition-all duration-500 ${isOver ? 'bg-red-500' : activeTab === 'marriage' ? 'bg-rose-500' : 'bg-amber-500'}`} 
                  />
                )}
              </div>

              {activeTab === 'combined' && (
                <div className="flex justify-between text-[9px] text-slate-400 font-mono pt-0.5">
                  <span className="text-rose-400">💍 Marriage: {formatCurrency(marriageSpent, true)}</span>
                  <span className="text-amber-400">🏗️ Engineer: {formatCurrency(constructionSpent, true)}</span>
                </div>
              )}
            </div>

            {/* Big Action Button */}
            <button
              onClick={() => setIsAddOpen(true)}
              className={`w-full py-3 rounded-2xl font-black text-xs text-white shadow-lg transition-transform active:scale-95 ${
                activeTab === 'construction'
                  ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black'
                  : activeTab === 'marriage'
                  ? 'bg-gradient-to-r from-rose-500 to-pink-600'
                  : 'bg-gradient-to-r from-indigo-600 to-violet-600'
              }`}
            >
              {activeTab === 'construction' ? '+ Record Amount Given to Engineer' : '+ Add Spend Entry'}
            </button>
          </div>

          {/* Graphical Illustration */}
          <div className="bg-slate-900 rounded-3xl p-4 border border-slate-800 shadow-md space-y-3">
            <div className="flex items-center justify-between text-xs font-bold text-slate-200">
              <span>📊 Graphical Illustration</span>
              <span className="font-mono text-[10px] text-slate-400">Spent: {formatCurrency(currentSpent, true)}</span>
            </div>

            <div className="relative h-40 flex items-center justify-center">
              <canvas ref={canvasRef}></canvas>
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                <span className="text-[9px] text-slate-400 font-bold uppercase">Total Spent</span>
                <span className="text-sm font-black text-white font-mono">{formatCurrency(currentSpent, true)}</span>
              </div>
            </div>
          </div>

          {/* Spend List */}
          <div className="bg-slate-900 rounded-3xl p-4 border border-slate-800 shadow-md space-y-3">
            <div className="flex items-center justify-between pb-1">
              <h3 className="text-xs font-bold text-white">
                {activeTab === 'combined' ? 'All Payment Records' : activeTab === 'marriage' ? 'Marriage Spends' : 'Engineer Payouts'} ({visibleExpenses.length})
              </h3>
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="Search..."
                className="w-28 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-[11px] text-white focus:outline-none"
              />
            </div>

            <div className="space-y-2">
              {visibleExpenses.length === 0 ? (
                <div className="text-center py-6 text-slate-500 text-xs">No records found.</div>
              ) : (
                visibleExpenses.map(exp => (
                  <div key={exp.id} className="bg-slate-800/80 rounded-2xl p-3 border border-slate-700/60 flex items-center justify-between gap-2">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <span className="text-base shrink-0">{exp.type === 'marriage' ? '💍' : '🏗️'}</span>
                      <div className="min-w-0">
                        <div className="text-xs font-bold text-white truncate">{exp.title}</div>
                        <div className="text-[10px] text-slate-400 flex items-center gap-1.5 mt-0.5">
                          <span>{exp.categoryName}</span>
                          <span>•</span>
                          <span>{formatDate(exp.date)}</span>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2 shrink-0">
                      <div className="text-xs font-black font-mono text-rose-400">- {formatCurrency(exp.amount)}</div>
                      <button 
                        onClick={() => handleDelete(exp.id)} 
                        className="text-slate-500 hover:text-red-400 text-xs px-1"
                      >
                        ✕
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Floating + Action Button */}
          <button
            onClick={() => setIsAddOpen(true)}
            className="fixed bottom-5 right-5 z-40 w-14 h-14 rounded-full bg-gradient-to-tr from-rose-500 to-amber-500 text-white font-black text-2xl shadow-2xl flex items-center justify-center border-2 border-white/20 active:scale-90"
          >
            +
          </button>

          {/* Add Modal */}
          {isAddOpen && (
            <AddModal
              activeTab={activeTab}
              marriageBalance={totalBudget - marriageSpent}
              engineerBalance={totalBudget - constructionSpent}
              engineerName={engineerName}
              onSave={handleAddExpense}
              onClose={() => setIsAddOpen(false)}
            />
          )}

          {/* Edit Budget Modal */}
          {isBudgetOpen && (
            <BudgetModal
              currentBudget={totalBudget}
              currentSqft={sqftArea}
              currentRate={ratePerSqft}
              currentEngineer={engineerName}
              onSave={(newB, sq, rt, eng) => {
                setTotalBudget(newB);
                setSqftArea(sq);
                setRatePerSqft(rt);
                setEngineerName(eng);
                setIsBudgetOpen(false);
              }}
              onClose={() => setIsBudgetOpen(false)}
            />
          )}

        </div>
      );
    }

    // Modal Components
    function AddModal({ activeTab, marriageBalance, engineerBalance, engineerName, onSave, onClose }) {
      const [type, setType] = useState(activeTab === 'construction' ? 'construction' : 'marriage');
      const [amount, setAmount] = useState('');
      const [title, setTitle] = useState('');
      const categories = type === 'marriage' ? MARRIAGE_CATEGORIES : ENGINEER_STAGES;
      const [catId, setCatId] = useState(categories[0].id);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);

      const currentBalance = type === 'marriage' ? marriageBalance : engineerBalance;
      const parsedAmount = Number(amount) || 0;

      const handleQuick = (val) => setAmount(((Number(amount) || 0) + val).toString());

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim() || parsedAmount <= 0) return;
        const cat = categories.find(c => c.id === catId);
        onSave({
          type,
          title: title.trim(),
          amount: parsedAmount,
          categoryId: catId,
          categoryName: cat ? cat.name : 'General',
          date,
          vendor: type === 'construction' ? engineerName : ''
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 p-0 sm:p-4 animate-in fade-in">
          <div className="bg-slate-900 border-t sm:border border-slate-700 rounded-t-3xl sm:rounded-3xl p-5 max-w-md w-full space-y-4 max-h-[90vh] overflow-y-auto">
            
            <div className="flex items-center justify-between pb-2 border-b border-slate-800">
              <h3 className="text-sm font-black text-white">Record Spend / Payment</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-sm">✕</button>
            </div>

            {/* Type Switcher */}
            <div className="grid grid-cols-2 gap-2 p-1 bg-slate-950 rounded-xl border border-slate-800 text-xs font-bold">
              <button
                type="button"
                onClick={() => { setType('marriage'); setCatId(MARRIAGE_CATEGORIES[0].id); }}
                className={`py-2 rounded-lg ${type === 'marriage' ? 'bg-rose-600 text-white shadow' : 'text-slate-400'}`}
              >
                💍 Marriage
              </button>
              <button
                type="button"
                onClick={() => { setType('construction'); setCatId(ENGINEER_STAGES[0].id); }}
                className={`py-2 rounded-lg ${type === 'construction' ? 'bg-amber-500 text-slate-950 shadow font-black' : 'text-slate-400'}`}
              >
                🏗️ Engineer
              </button>
            </div>

            {/* Deduction Preview */}
            <div className="bg-slate-800 p-2.5 rounded-xl text-xs flex justify-between font-mono">
              <span className="text-slate-400">Balance: {formatCurrency(currentBalance, true)}</span>
              <span className="text-rose-400">- {formatCurrency(parsedAmount, true)}</span>
              <span className="text-emerald-400">➔ {formatCurrency(currentBalance - parsedAmount, true)}</span>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1">Amount (₹)</label>
                <input
                  type="number"
                  required
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  placeholder="50000"
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-lg font-black font-mono text-white focus:outline-none"
                  autoFocus
                />
                <div className="flex gap-1.5 mt-1.5">
                  {[5000, 25000, 50000, 100000].map(v => (
                    <button
                      key={v}
                      type="button"
                      onClick={() => handleQuick(v)}
                      className="px-2 py-0.5 rounded-lg text-[10px] font-mono bg-slate-800 text-slate-300 border border-slate-700"
                    >
                      +{formatCurrency(v, true)}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1">Item / Description</label>
                <input
                  type="text"
                  required
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder={type === 'construction' ? 'e.g. Ground Floor Roof Slab Installment' : 'e.g. Catering Advance'}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1">Category / Stage</label>
                <div className="grid grid-cols-2 gap-1.5 max-h-32 overflow-y-auto p-1 bg-slate-950 rounded-xl border border-slate-800">
                  {categories.map(c => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => { setCatId(c.id); if (!title) setTitle(c.name); }}
                      className={`p-1.5 rounded-lg text-left text-[11px] flex items-center gap-1.5 border truncate ${
                        catId === c.id ? 'bg-indigo-950 border-indigo-500 text-indigo-200 font-bold' : 'bg-slate-900 border-slate-800 text-slate-400'
                      }`}
                    >
                      <span>{c.icon}</span>
                      <span className="truncate">{c.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-[10px] text-slate-400">Date</label>
                  <input
                    type="date"
                    required
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white"
                  />
                </div>
                <div>
                  <label className="block text-[10px] text-slate-400">{type === 'construction' ? 'Receiver' : 'Vendor'}</label>
                  <input
                    type="text"
                    defaultValue={type === 'construction' ? engineerName : ''}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white"
                  />
                </div>
              </div>

              <button
                type="submit"
                className={`w-full py-3 rounded-xl font-black text-xs text-white shadow-lg ${
                  type === 'construction' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-rose-600'
                }`}
              >
                Deduct & Save Record
              </button>
            </form>
          </div>
        </div>
      );
    }

    function BudgetModal({ currentBudget, currentSqft, currentRate, currentEngineer, onSave, onClose }) {
      const [budget, setBudget] = useState(currentBudget.toString());
      const [sqft, setSqft] = useState(currentSqft.toString());
      const [rate, setRate] = useState(currentRate.toString());
      const [eng, setEng] = useState(currentEngineer);

      const handleSqft = (newSq, newRt) => {
        setSqft(newSq);
        setRate(newRt);
        const calc = (Number(newSq) || 0) * (Number(newRt) || 0);
        if (calc > 0) setBudget(calc.toString());
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 animate-in fade-in">
          <div className="bg-slate-900 border border-slate-700 rounded-3xl p-5 max-w-sm w-full space-y-4">
            <div className="flex items-center justify-between pb-2 border-b border-slate-800">
              <h3 className="text-sm font-bold text-white">Set Total Budget / Fund</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-sm">✕</button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-300 mb-1">Total Available Capital (₹)</label>
                <input
                  type="number"
                  value={budget}
                  onChange={(e) => setBudget(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-lg font-black font-mono text-white focus:outline-none"
                />
                <div className="text-xs text-slate-400 mt-1 font-mono">{formatCurrency(Number(budget) || 0)}</div>
              </div>

              {/* SqFt Engineer Contract */}
              <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700 space-y-2">
                <div className="text-xs font-bold text-amber-300">🏗️ Sq.Ft Rate Calculator</div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[10px] text-slate-400">Sq.Ft Area</label>
                    <input
                      type="number"
                      value={sqft}
                      onChange={(e) => handleSqft(e.target.value, rate)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] text-slate-400">Rate / Sq.Ft</label>
                    <input
                      type="number"
                      value={rate}
                      onChange={(e) => handleSqft(sqft, e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white font-mono"
                    />
                  </div>
                </div>
              </div>

              <button
                onClick={() => onSave(Number(budget) || 0, Number(sqft) || 1250, Number(rate) || 2000, eng)}
                className="w-full py-2.5 rounded-xl font-bold text-xs text-white bg-indigo-600 hover:bg-indigo-500 shadow-md"
              >
                Save & Apply to Both
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
